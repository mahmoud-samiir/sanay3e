spring:
  application:
    name: sanay3e

  # ===============================
  # DATABASE CONFIGURATION
  # ===============================
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sanay3e}
    username: ${DB_USERNAME:sanay3e}
    password: ${DB_PASSWORD:sanay3e}
    driver-class-name: org.postgresql.Driver


  # ===============================
  # JPA / HIBERNATE
  # ===============================
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

# ===============================
# JWT CONFIGURATION
# ===============================
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

springdoc:
  swagger-ui:
    persistAuthorization: true
  api-docs:
    path: /v3/api-docs